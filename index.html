<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA / iOS App Nativa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ludoteca" />
  <meta name="application-name" content="Ludoteca" />
  <meta id="meta-theme-color" name="theme-color" content="#142620" />
  <meta name="description" content="Registro unificado de partidas, estadísticas y marcadores rápidos para tu ludoteca con sincronización en Google Sheets." />

  <title>Ludoteca — Diario de Partidas</title>

  <!-- Iconos y Manifest estáticos reales para iOS / Android -->
  <link id="dynamic-apple-icon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link id="dynamic-favicon" rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link id="dynamic-manifest" rel="manifest" href="./manifest.json" />

  <!-- Tipografías: Plus Jakarta Sans (Display) + Inter (UI/Tabulares) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Hoja de estilos estática compilada (arranque instantáneo sin Tailwind CDN) -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- Chart.js para gráficas interactivas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body class="font-sans antialiased selection:bg-emeraldBrand/20">
<div id="app-bg">

    <!-- ==================== TOP BAR COMPACTA DE LUJO ==================== -->
    <header class="shrink-0 z-20 header-pro text-white">
      <div class="max-w-4xl mx-auto px-4 pb-2.5 flex items-center justify-between gap-3">
        <!-- Brand -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-[11px] bg-gradient-to-br from-emerald-400/30 via-amber-400/20 to-white/10 border border-white/20 flex items-center justify-center shrink-0 shadow-sm">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <polygon points="14,2 25,8.2 25,19.8 14,26 3,19.8 3,8.2" fill="rgba(255,255,255,0.14)" stroke="#F6F3EC" stroke-width="1.7"/>
              <circle cx="10.2" cy="11.2" r="2.2" fill="#FBBF24"/>
              <circle cx="17.8" cy="11.2" r="2.2" fill="#34D399"/>
              <circle cx="14" cy="17.5" r="2.3" fill="#FB7185"/>
            </svg>
          </div>
          <div class="min-w-0">
            <h1 class="font-display text-[15px] sm:text-base font-extrabold tracking-tight leading-none truncate">Ludoteca</h1>
            <p id="header-subtitle" class="text-[10.5px] font-medium text-white/60 mt-0.5 truncate">Diario de Partidas</p>
          </div>
        </div>

        <!-- Controles: Crono en vivo + Modo oscuro + Estado Sheets -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button
            id="btn-header-timer"
            type="button"
            data-action="focus-timer"
            class="hidden btn-tap inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-extrabold tabular-nums bg-emerald-500/22 border border-emerald-300/40 text-emerald-100"
            title="Cronómetro de partida en marcha"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
            <span id="header-timer-text">00:00</span>
          </button>

          <button
            id="btn-table-tools"
            type="button"
            data-action="open-table-tools"
            class="btn-tap w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 flex items-center justify-center text-amber-200"
            title="Utilidades de mesa (¿A qué jugar?, ¿Quién empieza?, rondas y turno)"
            aria-label="Utilidades de mesa"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"/>
              <circle cx="8.5" cy="8.5" r="1.15" fill="currentColor" stroke="none"/>
              <circle cx="15.5" cy="8.5" r="1.15" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/>
              <circle cx="8.5" cy="15.5" r="1.15" fill="currentColor" stroke="none"/>
              <circle cx="15.5" cy="15.5" r="1.15" fill="currentColor" stroke="none"/>
            </svg>
          </button>

          <button
            id="btn-theme-toggle"
            type="button"
            class="btn-tap w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 flex items-center justify-center text-white/90"
            title="Cambiar tema claro/oscuro"
            aria-label="Cambiar tema"
          >
            <svg id="icon-sun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg id="icon-moon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </button>

          <button
            id="btn-sync-settings"
            type="button"
            class="btn-tap inline-flex items-center gap-1.5 pl-2.5 pr-2.5 py-1 rounded-full text-[11px] font-semibold border transition-all bg-white/10 border-white/18 text-white"
            title="Configurar Google Sheets y copia de seguridad"
          >
            <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span>
            <span id="sync-label">Modo local</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ==================== MAIN CONTENT (SCROLL INTERNO INDEPENDIENTE) ==================== -->
    <main id="main-scroll" class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden">
      <div class="max-w-4xl w-full mx-auto px-3.5 sm:px-6 pt-4 pb-6">
        <section id="view-log" class="space-y-4"></section>
        <section id="view-history" class="hidden space-y-4"></section>
        <section id="view-stats" class="hidden space-y-4"></section>
        <section id="view-shelf" class="hidden space-y-4"></section>
      </div>
    </main>

    <!-- ==================== BARRA INFERIOR ULTRA-FINA ESTILO iOS NATIVO ==================== -->
    <nav id="bottom-nav" class="shrink-0 z-20" aria-label="Navegación principal">
      <div class="max-w-md mx-auto px-2 grid grid-cols-4 gap-0.5">
        <button type="button" data-nav="log" class="nav-btn btn-tap">
          <span class="nav-ind"></span>
          <span class="nav-icon-wrap">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
            </svg>
          </span>
          <span class="text-[10px] sm:text-xs font-bold tracking-[-0.01em] leading-none">Registrar</span>
        </button>

        <button type="button" data-nav="history" class="nav-btn btn-tap">
          <span class="nav-ind"></span>
          <span class="nav-icon-wrap relative">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
            </svg>
            <span id="nav-history-badge" class="hidden absolute -top-1 -right-0.5 min-w-[15px] h-[15px] px-1 rounded-full bg-emeraldBrand text-white text-[9px] font-extrabold flex items-center justify-center tabular-nums ring-2 ring-[#FAF8F4] dark:ring-[#0F1714]">0</span>
          </span>
          <span class="text-[10px] sm:text-xs font-bold tracking-[-0.01em] leading-none">Historial</span>
        </button>

        <button type="button" data-nav="stats" class="nav-btn btn-tap">
          <span class="nav-ind"></span>
          <span class="nav-icon-wrap">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7" rx="1"/><rect x="13" y="6" width="3" height="11" rx="1"/><rect x="19" y="13" width="2" height="4" rx="1"/>
            </svg>
          </span>
          <span class="text-[10px] sm:text-xs font-bold tracking-[-0.01em] leading-none">Stats</span>
        </button>

        <button type="button" data-nav="shelf" class="nav-btn btn-tap">
          <span class="nav-ind"></span>
          <span class="nav-icon-wrap">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/>
            </svg>
          </span>
          <span class="text-[10px] sm:text-xs font-bold tracking-[-0.01em] leading-none">Ludoteca</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- ==================== MODAL / BOTTOM SHEET OVERLAY ==================== -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center sm:p-4 bg-black/55 backdrop-blur-[4px]">
    <div id="modal-card" class="bg-canvas dark:bg-surfaceDark border-t sm:border border-black/10 dark:border-white/12 rounded-t-[28px] sm:rounded-[28px] max-w-lg w-full max-h-[88vh] flex flex-col shadow-elevated anim-sheet overflow-hidden">
      <div class="sm:hidden flex justify-center pt-2.5 pb-0.5 shrink-0">
        <div class="w-10 h-1 rounded-full bg-black/15 dark:bg-white/20"></div>
      </div>
      <div class="px-5 pt-3 sm:pt-4 pb-3 border-b border-black/[0.06] dark:border-white/10 flex items-center justify-between gap-3 shrink-0">
        <div class="min-w-0">
          <h3 id="modal-title" class="font-display text-base sm:text-lg font-extrabold text-ink dark:text-white truncate"></h3>
          <p id="modal-subtitle" class="text-[11px] text-inkMuted dark:text-white/60 hidden mt-0.5"></p>
        </div>
        <button id="modal-close-x" type="button" class="btn-tap w-8 h-8 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/15 flex items-center justify-center text-inkMuted dark:text-white/75 shrink-0" aria-label="Cerrar">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto flex-1 text-sm text-ink dark:text-white/90"></div>
      <div id="modal-actions" class="px-5 py-3.5 border-t border-black/[0.06] dark:border-white/10 bg-white/75 dark:bg-black/25 flex flex-wrap items-center justify-end gap-2 shrink-0"></div>
    </div>
  </div>

  <!-- ==================== TOAST NOTIFICATIONS ==================== -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] pointer-events-none flex flex-col items-center gap-2 w-full max-w-xs px-4"></div>
</body>
</html>
